name: Deploy site to GitHub Pages

# The site is a static export, so it is built here and the resulting `out/`
# directory is published to Pages. Nothing is committed back to the repo — the
# build output stays a build artefact.

on:
  # every push to main republishes
  push:
    branches: [main]
  # lets the site be republished by hand from the Actions tab
  workflow_dispatch:
  schedule:
    # The year count on the site is derived from the founding year at BUILD time
    # (a static host has no server to re-render, so the old daily `revalidate`
    # could not survive the move). These rebuilds are what keep it honest.
    #
    # 20:05 UTC on 31 December is 00:05 on 1 January in Muscat, and the TZ below
    # makes the build agree — so the count rolls over as the new year begins in
    # Oman rather than four hours late.
    - cron: "5 20 31 12 *"
    # Monthly safety net: GitHub disables scheduled workflows on a repository
    # that has seen no commits for 60 days, so a once-a-year cron on a quiet repo
    # would quite likely never fire. This also keeps the deploy path warm enough
    # that a failure is noticed long before it matters.
    - cron: "0 3 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel, so a running publish is
# always allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Runners are UTC. The company is in Oman, so the build's idea of "this
      # year" should be Oman's.
      TZ: Asia/Muscat
      # A project site is served from https://<account>.github.io/<repo>/, so the
      # app has to be built knowing that prefix. Derived from the repository name
      # rather than hard-coded, so renaming the repo cannot leave a stale path
      # behind. Consumed by next.config.ts and lib/asset.ts.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build static export
        run: npm run build
        working-directory: site

      # Belt and braces: artifact deploys do not run Jekyll, but if the source
      # ever switches back to branch-based publishing this is what stops Jekyll
      # discarding the `_next` directory for starting with an underscore.
      - name: Disable Jekyll
        run: touch site/out/.nojekyll

      # NOTE: there is deliberately no `actions/configure-pages` step.
      #
      # It was here with `enablement: true`, to switch Pages on without anyone
      # visiting repository settings, and the run failed on exactly that step —
      # the workflow token was not allowed to create the Pages site. Its only
      # other purpose is to report the deployment's base path back to the build,
      # which this workflow does not use: NEXT_PUBLIC_BASE_PATH above is derived
      # from the repository name directly. So the step was pure risk, and Pages
      # is enabled once by hand in Settings instead.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
